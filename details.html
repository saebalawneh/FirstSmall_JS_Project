<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View a person's details in People Manager.">
  <title>Person Details | People Manager</title>
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = { darkMode: 'class' };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    html {
      background-color: rgb(248 250 252);
    }

    html.dark {
      background-color: rgb(2 6 23);
    }

    html.dark body {
      background-color: rgb(2 6 23);
      color: rgb(241 245 249);
    }

    html.dark header {
      border-color: rgb(30 41 59);
      background-color: rgb(15 23 42);
    }

    html.dark #person-details {
      border-color: rgb(30 41 59);
      background-color: rgb(15 23 42);
    }

    .detail-field {
      border: 1px solid rgb(199 210 254);
      background-color: rgb(238 242 255);
      color: rgb(15 23 42);
    }

    .dark .detail-field {
      border-color: rgb(67 56 202);
      background-color: rgb(30 27 75);
      color: rgb(238 242 255);
    }
  </style>
</head>
<body class="min-h-full bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
  <div class="min-h-screen">
    <!-- Page header: use #app-title and #theme-toggle for shared page controls. -->
    <header class="border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-900/90">
      <div class="mx-auto flex max-w-4xl items-center justify-between gap-4 px-4 py-5 sm:px-6 lg:px-8">
        <a id="app-title" href="index.html" class="flex items-center gap-3" aria-label="People Manager home">
          <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 text-lg font-bold text-white shadow-sm">P</span>
          <span class="text-lg font-bold tracking-tight">People Manager</span>
        </a>
        <button id="theme-toggle" type="button" class="rounded-lg border border-slate-200 px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800" aria-label="Toggle dark mode">
          <span id="theme-toggle-label">Dark mode</span>
        </button>
      </div>
    </header>

    <main class="mx-auto max-w-4xl px-4 py-8 sm:px-6 sm:py-12 lg:px-8">
      <!-- Navigation: use #back-link to return to the list. -->
      <a id="back-link" href="index.html" class="mb-6 inline-flex items-center gap-2 text-sm font-semibold text-indigo-600 transition hover:text-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:text-indigo-400 dark:hover:text-indigo-300">
        <span aria-hidden="true">←</span>
        Back to people
      </a>

      <!-- Not-found state: show #person-not-found when the requested id is invalid. -->
      <section id="person-not-found" class="hidden rounded-2xl border border-amber-200 bg-amber-50 p-8 text-center dark:border-amber-900 dark:bg-amber-950/40" aria-live="polite">
        <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-amber-100 text-2xl dark:bg-amber-900">!</div>
        <h1 class="text-2xl font-bold">Person not found</h1>
        <p id="not-found-message" class="mx-auto mt-2 max-w-md text-sm text-amber-800 dark:text-amber-200">We could not find the person you requested.</p>
      </section>

      <!-- Person details: fill #detail-photo, #detail-name, #detail-age, #detail-email, and #detail-password from JavaScript. -->
      <section id="person-details" class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900">
        <div class="bg-gradient-to-br from-indigo-600 to-violet-600 px-6 py-8 sm:px-10 sm:py-12">
          <div class="flex flex-col items-center gap-5 text-center sm:flex-row sm:text-left">
            <img id="detail-photo" src="" alt="Person profile" class="h-32 w-32 rounded-2xl border-4 border-white/50 bg-white/20 object-cover shadow-lg sm:h-40 sm:w-40">
            <div class="text-white">
              <p class="text-sm font-medium uppercase tracking-wider text-indigo-100">Person profile</p>
              <h1 id="detail-name" class="mt-2 text-3xl font-bold tracking-tight sm:text-4xl"></h1>
              <p id="detail-age" class="mt-2 text-indigo-100"></p>
            </div>
          </div>
        </div>

        <div class="grid gap-6 p-6 sm:grid-cols-2 sm:p-10">
          <div class="detail-field">
            <p class="detail-label">Email</p>
            <p id="detail-email" class="break-words text-base font-medium text-slate-900 dark:text-indigo-50"></p>
          </div>
          <div class="detail-field">
            <p class="detail-label">Password</p>
            <div class="flex items-center gap-3">
              <p id="detail-password" class="break-all font-mono text-base font-medium text-slate-900 dark:text-indigo-50" aria-live="polite">••••••••</p>
              <button id="password-toggle" data-password-visible="false" type="button" class="shrink-0 rounded-lg border border-indigo-300 bg-white px-3 py-1.5 text-xs font-semibold text-indigo-700 transition hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:border-indigo-500 dark:bg-indigo-950 dark:text-indigo-100 dark:hover:bg-indigo-900">Show</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const themeToggle = document.querySelector('#theme-toggle');
    const themeToggleLabel = document.querySelector('#theme-toggle-label');
    const savedTheme = localStorage.getItem('people-manager-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    const setTheme = (isDark) => {
      document.documentElement.classList.toggle('dark', isDark);
      document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
      themeToggleLabel.textContent = isDark ? 'Light mode' : 'Dark mode';
      themeToggle.setAttribute('aria-pressed', String(isDark));
    };

    setTheme(savedTheme ? savedTheme === 'dark' : prefersDark);

    themeToggle.addEventListener('click', () => {
      const isDark = !document.documentElement.classList.contains('dark');
      localStorage.setItem('people-manager-theme', isDark ? 'dark' : 'light');
      setTheme(isDark);
    });

    const userId = new URLSearchParams(window.location.search).get('id');
    const detailsSection = document.querySelector('#person-details');
    const notFoundSection = document.querySelector('#person-not-found');
    const notFoundMessage = document.querySelector('#not-found-message');
    const passwordToggle = document.querySelector('#password-toggle');
    const passwordValue = document.querySelector('#detail-password');
    let person = null;

    const showNotFound = (message) => {
      detailsSection.classList.add('hidden');
      notFoundSection.classList.remove('hidden');
      notFoundMessage.textContent = message;
    };

    const loadPerson = async () => {
      if (!userId) {
        showNotFound('No person was selected. Return to the people list and choose Details again.');
        return;
      }

      try {
        const response = await fetch('https://ums12.runasp.net/api/users?limit=1000');
        if (!response.ok) {
          throw new Error(`People request failed with status ${response.status}`);
        }

        const result = await response.json();
        person = result.users?.find((user) => String(user.id) === userId) || null;

        if (!person) {
          showNotFound('This user is no longer available. Return to the people list and choose Details again.');
          return;
        }

        document.querySelector('#detail-name').textContent = person.name || 'Unnamed user';
        document.querySelector('#detail-age').textContent = `Age ${person.age ?? 'N/A'}`;
        document.querySelector('#detail-email').textContent = person.email || 'N/A';
        passwordValue.textContent = '••••••••';

        if (person.imageUrl) {
          const photo = document.querySelector('#detail-photo');
          photo.src = person.imageUrl;
          photo.alt = `${person.name || 'Person'} profile photo`;
        } else {
          document.querySelector('#detail-photo').classList.add('hidden');
        }
      } catch (error) {
        console.error('Unable to load person details.', error);
        showNotFound('We could not load this person. Return to the people list and try again.');
      }
    };

 passwordToggle.addEventListener('click', () => {
  const isVisible = passwordToggle.dataset.passwordVisible === 'true';
  passwordToggle.dataset.passwordVisible = String(!isVisible);
  passwordToggle.textContent = isVisible ? 'Show' : 'Hide';

  const saved = localStorage.getItem(`user-password-${person?.email}`);
  passwordValue.textContent = isVisible ? '••••••••' : (saved || 'N/A');
});

    loadPerson();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>  
  <script src='./details.js' ></script>
</body>
</html>
